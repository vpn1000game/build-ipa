name: NxNative - Updated IPA Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback - no-bc)"
        options:
          - "iPhone 15 or older (BC fallback - no-bc)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout BC fallback version (no-bc branch)
        if: inputs.device == 'iPhone 15 or older (BC fallback - no-bc)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: no-bc

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version || true
          brew install xcodegen zstd spirv-cross unar glslang
          python -m pip install --upgrade pip
          python -m pip install \
            lz4 "capstone>=5,<6" fonttools nsz zbic zstd backports.zstd gdown

      - name: Download game files, mod, and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
          MOD_URL: ${{ secrets.MOD_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"
            local file_id

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            url="$(echo "$url" | tr -d '[:space:]')"

            file_id="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse, parse_qs

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None

          if parsed.netloc.lower() in (
              "drive.google.com",
              "www.drive.google.com",
          ):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(
              r"[-A-Za-z0-9_]{20,}", url
          ):
              file_id = url

          print(file_id or "")
          PY
          )"

            echo "Downloading $(basename "$output")..."
            if [[ -n "$file_id" ]]; then
              gdown "$file_id" -O "$output"
            else
              curl -fL --retry 3 --retry-delay 2 \
                -A "Mozilla/5.0" \
                "$url" -o "$output"
            fi

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            file "$output"
          }

          download_file "$GAME_URL" "$WORK/game.download"
          
          if [[ -n "${KEYS_URL:-}" ]]; then
            download_file "$KEYS_URL" "$WORK/prod.keys"
            chmod 600 "$WORK/prod.keys"
          else
            echo "No KEYS_URL configured (only valid if building from .nup)."
          fi

          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          fi

          if [[ -n "${DLC_URL:-}" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          fi

          if [[ -n "${MOD_URL:-}" ]]; then
            download_file "$MOD_URL" "$WORK/mod.zip"
            mkdir -p "$WORK/mod_extracted"
            unar -o "$WORK/mod_extracted" "$WORK/mod.zip"
            echo "Mod extracted successfully."
          fi

      - name: Extract archives or prepare game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          package_extensions = {".nsp", ".xci", ".nsz", ".xcz", ".nup"}
          rar_signatures = (b"Rar!\x1a\x07\x00", b"Rar!\x1a\x07\x01\x00")

          def add_package(source, label):
              target = game_dir / source.name
              if target.exists():
                  raise SystemExit("Duplicate package filename: " + source.name)
              shutil.copy2(source, target)
              print(f"Added {label}: {target.name} ({target.stat().st_size:,} bytes)")

          def process_download(label):
              source = work / f"{label}.download"
              if not source.exists():
                  return

              with source.open("rb") as f:
                  signature = f.read(8)

              is_rar = any(signature.startswith(magic) for magic in rar_signatures)
              is_zip = signature.startswith(b"PK\x03\x04")

              if is_rar or is_zip:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)
                  print(f"{label}: archive detected; extracting.")
                  subprocess.run(["unar", "-o", str(extract_dir), str(source)], check=True)
                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file() and p.suffix.lower() in package_extensions
                  )
                  if not packages:
                      raise SystemExit(f"No valid game packages found in {label} archive.")
                  for package in packages:
                      add_package(package, label)
              else:
                  if signature[:4] == b"PFS0":
                      extension = ".nsp"
                  elif signature[:4] == b"HEAD":
                      extension = ".xci"
                  elif signature[:4] == b"NUP\x00" or signature[:3] == b"NUP":
                      extension = ".nup"
                  else:
                      extension = ".nsp"
                  target = game_dir / f"{label}{extension}"
                  shutil.copy2(source, target)
                  print(f"Added direct package: {target.name} ({target.stat().st_size:,} bytes)")

          process_download("game")
          process_download("update")
          process_download("dlc")
          PY

      - name: Update shader toolchain lock and header
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CHAIN_SCRIPT="$(find . -name dmsh_chain.py -type f -print -quit)"
          if [[ -n "$CHAIN_SCRIPT" ]]; then
            python "$CHAIN_SCRIPT" --update-lock
            python "$CHAIN_SCRIPT" --header
          fi

      - name: Build unsigned IPA
        env:
          ALLOW_OTHER_METAL: "1"
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          # Compatibility patch for older Xcode/iOS SDKs if needed
          python - <<'PY'
          from pathlib import Path

          bad_tokens = (
              "reactiveMaskTextureUsage",
              "reactiveTextureUsage",
              "colorContentOffsetX",
              "colorContentOffsetY",
              "depthContentOffsetX",
              "depthContentOffsetY",
              "motionContentOffsetX",
              "motionContentOffsetY",
              "reactiveMaskContentOffsetX",
              "reactiveMaskContentOffsetY",
              "outputOffsetX",
              "outputOffsetY",
          )

          for path in Path(".").rglob("nvn_mtl.m"):
              lines = path.read_text(errors="replace").splitlines(keepends=True)
              changed = False
              new_lines = []
              for line in lines:
                  stripped = line.lstrip()
                  if "else u = sc.reactiveTextureUsage;" in line:
                      indent = line[: len(line) - len(stripped)]
                      new_lines.append(f"{indent}u = sc.reactiveTextureUsage;\n")
                      changed = True
                  elif any(tok in line for tok in bad_tokens) and not stripped.startswith("//"):
                      new_lines.append("// " + line)
                      changed = True
                  else:
                      new_lines.append(line)
              if changed:
                  path.write_text("".join(new_lines))
                  print(f"Patched {path}")

          for path in Path(".").rglob("DmGamepad.m"):
              lines = path.read_text(errors="replace").splitlines(keepends=True)
              changed = False
              new_lines = []
              for line in lines:
                  if "deviceMotionBody" in line and not line.lstrip().startswith("//"):
                      new_lines.append("// " + line)
                      changed = True
                  else:
                      new_lines.append(line)
              if changed:
                  path.write_text("".join(new_lines))
                  print(f"Patched {path}")
          PY

          KEY_ARGS=()
          if [[ -s "$WORK/prod.keys" ]]; then
            KEY_ARGS=(-k "$WORK/prod.keys")
          fi

          python3 scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            "${KEY_ARGS[@]}" \
            -o "$OUTPUT" \
            --allow-other-metal

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback - no-bc)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/nxnative" "$RUNNER_TEMP/GameFiles"
          " "$RUNNER_TEMP/GameFiles"
          
